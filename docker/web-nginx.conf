server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite fingerprints these, so the filename changes whenever the content does.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Not fingerprinted — a 7d immutable cache would pin third-party sites to an
  # old embed script for a week after every deploy.
  location = /widget.js {
    add_header Cache-Control "public, max-age=300, must-revalidate";
    try_files $uri =404;
  }

  # Backward-compatible extensionless embed URL. It must never fall through to
  # index.html, because browsers then try to execute the SPA shell as JavaScript.
  location = /widget {
    default_type application/javascript;
    add_header Cache-Control "public, max-age=300, must-revalidate";
    try_files /widget.js =404;
  }

  location = /version.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # The HTML shell names the hashed bundles, so a cached copy silently pins the
  # whole app to the previous build and makes a good deploy look like a no-op.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
