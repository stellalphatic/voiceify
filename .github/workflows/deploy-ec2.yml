name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/workflows/ci.yml"

concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy via Docker Compose
    runs-on: ubuntu-latest
    if: github.repository == 'stellalphatic/voiceify'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="/home/ubuntu/voiceify"; fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            # Compose runs DB migrations inside the api entrypoint
            if [ -f .env ] && grep -q '^DOMAIN=' .env; then
              docker compose --profile tls up -d --build
            else
              docker compose up -d --build
            fi
            sleep 8
            docker compose exec -T api node -e "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
