<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#00D992" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00D992" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D992"/>
      <stop offset="100%" stop-color="#00b67a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g stroke="#1a1d23" stroke-width="1" opacity="0.6">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" fill="none"/>
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630" fill="none"/>
  </g>

  <!-- Logo orb -->
  <g transform="translate(96, 220)">
    <rect x="0" y="0" width="84" height="84" rx="18" fill="url(#orb)"/>
    <g transform="translate(14, 14)" stroke="#050507" stroke-width="4" stroke-linecap="round">
      <line x1="6"  y1="28" x2="6"  y2="28"/>
      <line x1="16" y1="18" x2="16" y2="38"/>
      <line x1="28" y1="8"  x2="28" y2="48"/>
      <line x1="40" y1="14" x2="40" y2="42"/>
      <line x1="50" y1="22" x2="50" y2="34"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="220" y="285" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="70" fill="#ffffff" letter-spacing="-2">Voiceify</text>

  <!-- Headline -->
  <text x="96" y="400" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="68" fill="#ffffff" letter-spacing="-2">Voice AI That</text>
  <text x="96" y="476" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="68" fill="#00D992" letter-spacing="-2">Sounds Human</text>

  <!-- Subhead -->
  <text x="96" y="540" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="26" fill="#9aa0aa">Sub-500ms latency · 40+ languages · Enterprise security</text>

  <!-- Footer chip -->
  <g transform="translate(96, 580)">
    <rect x="0" y="0" width="180" height="34" rx="6" fill="#101319" stroke="#23272f"/>
    <circle cx="14" cy="17" r="4" fill="#00D992"/>
    <text x="26" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#cfd2d8">LIVE · v3.2</text>
  </g>

  <!-- URL -->
  <text x="1104" y="600" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6b7480">voiceify.ai</text>
</svg>
